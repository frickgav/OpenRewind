name: Mac app

on:
  push:
    paths: ["Sources/**", "Package.swift", "Package.resolved", "THIRD_PARTY_NOTICES.txt", "packaging/**", "scripts/build-app.sh", "scripts/make-icons.py", "scripts/*-signing-cert.sh", "scripts/mcp-check.py", "scripts/gif-check.py", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["Sources/**", "Package.swift", "Package.resolved", "THIRD_PARTY_NOTICES.txt", "packaging/**", "scripts/build-app.sh", "scripts/make-icons.py", "scripts/*-signing-cert.sh", "scripts/mcp-check.py", "scripts/gif-check.py", ".github/workflows/mac.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Branch and PR builds sign with a throwaway certificate. The real one lives only in the
      # "release" environment, which only the Release workflow on main or a v* tag can open (see
      # "Signing" in the README), so code nobody has reviewed never runs next to the real key.
      - name: Load a throwaway signing certificate
        run: |
          OUT="$RUNNER_TEMP/throwaway" scripts/make-signing-cert.sh "OpenRewind Throwaway" >/dev/null
          MACOS_CERTIFICATE_P12="$(cat "$RUNNER_TEMP/throwaway/openrewind-signing.p12.b64")"
          MACOS_CERTIFICATE_PASSWORD="$(cat "$RUNNER_TEMP/throwaway/password.txt")"
          export MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD
          scripts/import-signing-cert.sh
      - name: Build, sign and package
        run: scripts/build-app.sh
      - name: Remove the signing keychain
        if: always()
        run: scripts/import-signing-cert.sh --remove
      - name: Check the signature names the certificate
        run: codesign --display --requirements - dist/OpenRewind.app 2>&1 | grep -E '^designated => .*(certificate (leaf|root)|anchor apple generic)'
      - name: Check the CLI starts
        run: dist/OpenRewind.app/Contents/MacOS/OpenRewind help
      # Export Clip's GIF encoder (GifWriter.swift): write a test GIF and decode it with an independent decoder.
      - name: GIF encoder check
        run: |
          dist/OpenRewind.app/Contents/MacOS/OpenRewind gif-check "$RUNNER_TEMP/check.gif"
          python3 scripts/gif-check.py "$RUNNER_TEMP/check.gif"
      # Connect AI Apps' JSON and TOML editors and safe file writes (MCPConnectCheck.swift), on the
      # same cases as the Windows tests.
      - name: One-click connect check
        run: dist/OpenRewind.app/Contents/MacOS/OpenRewind connect-check "$RUNNER_TEMP/connect-check"
      # Start it as an AI app does (OpenRewind mcp, pipes for stdin/stdout) and talk MCP to it,
      # with the Settings switch off, then on with an empty history.
      - name: MCP check
        run: |
          export OPENREWIND_HOME="$RUNNER_TEMP/openrewind-mcp-home"
          EXE=dist/OpenRewind.app/Contents/MacOS/OpenRewind
          defaults delete ai.agilityresources.openrewind mcpEnabled 2>/dev/null || true
          python3 scripts/mcp-check.py "$EXE" off
          "$EXE" delete 15m
          defaults write ai.agilityresources.openrewind mcpEnabled -bool true
          python3 scripts/mcp-check.py "$EXE" on
          defaults delete ai.agilityresources.openrewind mcpEnabled
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenRewind-mac
          path: dist/*.dmg
