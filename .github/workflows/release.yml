name: Release

# Builds the Mac .dmg and the Windows app (signed when the Azure Trusted Signing secrets are set)
# and attaches them to a GitHub Release with stable file names, so the website can link to
#   https://github.com/frickgav/openscreen/releases/latest/download/OpenRewind-mac.dmg
#   https://github.com/frickgav/openscreen/releases/latest/download/OpenRewind-windows-x64.zip
#
# Start a release either way:
#   git tag v0.2.0 && git push origin v0.2.0
#   or Actions → Release → Run workflow, and type the version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.2.0"
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  mac:
    runs-on: macos-15
    # The signing secrets live in this environment, which only main and v* tags may use.
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Every release must be signed with the same certificate, or updating resets the Mac
      # permissions (see "Signing" in the README). A Developer ID .p12 drops into the same secrets.
      - name: Load the signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "::error::Add the MACOS_CERTIFICATE_P12 and MACOS_CERTIFICATE_PASSWORD secrets (scripts/make-signing-cert.sh makes them)"
            exit 1
          fi
          scripts/import-signing-cert.sh
      # With a Developer ID certificate, notarize too (an App Store Connect API key, see "Signing" in
      # the README). Without these secrets the build is signed but not notarized.
      - name: Load the notarization key
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$APPLE_NOTARY_KEY" ]; then
            echo "::warning::No APPLE_NOTARY_KEY secret: the .dmg won't be notarized"
            exit 0
          fi
          KEY="$RUNNER_TEMP/notary/AuthKey.p8"
          (umask 077; mkdir -p "$(dirname "$KEY")"; printf '%s\n' "$APPLE_NOTARY_KEY" > "$KEY")
          {
            echo "NOTARY_KEY_PATH=$KEY"
            echo "NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID"
            echo "NOTARY_ISSUER=$APPLE_NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Build the app and .dmg
        run: |
          export VERSION="${VERSION#v}"
          scripts/build-app.sh
          cp dist/*.dmg dist/OpenRewind-mac.dmg
          codesign --display --requirements - dist/OpenRewind.app 2>&1 | grep -E '^designated => .*(certificate (leaf|root)|anchor apple generic)'
      - name: Remove the signing keychain
        if: always()
        run: |
          scripts/import-signing-cert.sh --remove
          rm -rf "$RUNNER_TEMP/notary"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac
          path: dist/OpenRewind-mac.dmg

  windows:
    runs-on: windows-latest
    environment: release
    strategy:
      matrix:
        arch: [x64, arm64]
    env:
      # Signing runs only when the Azure Trusted Signing secrets are set (see windows/README.md).
      CAN_SIGN: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: hashFiles('scripts/build-windows.ps1') != ''
        with:
          dotnet-version: 8.0.x
      - name: Build the app and .zip
        if: hashFiles('scripts/build-windows.ps1') != ''
        shell: pwsh
        run: |
          $env:VERSION = $env:VERSION.TrimStart("v")
          scripts/build-windows.ps1 -Arch ${{ matrix.arch }}
          Copy-Item "dist/OpenRewind-$env:VERSION-win-${{ matrix.arch }}.zip" "dist/OpenRewind-windows-${{ matrix.arch }}.zip"
      - name: Sign with Azure Trusted Signing
        if: hashFiles('scripts/build-windows.ps1') != '' && env.CAN_SIGN == 'true'
        uses: azure/trusted-signing-action@0d74250c661747df006298d0fb49944c10f16e03 # v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: dist/win-${{ matrix.arch }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Zip the signed app
        if: hashFiles('scripts/build-windows.ps1') != '' && env.CAN_SIGN == 'true'
        shell: pwsh
        run: Compress-Archive -Force -Path "dist/win-${{ matrix.arch }}/*" -DestinationPath "dist/OpenRewind-windows-${{ matrix.arch }}.zip"
      # Start the exe that is about to be published and make sure it is still running 30 s later,
      # so a build that crashes on startup fails the release instead of being attached to it.
      # It runs on the signed files when signing is on, but never needs signing to be set up.
      - name: Launch check
        if: hashFiles('scripts/build-windows.ps1') != '' && matrix.arch == 'x64'
        shell: pwsh
        run: scripts/launch-check-windows.ps1 -ExePath dist/win-x64/OpenRewind.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: hashFiles('scripts/build-windows.ps1') != ''
        with:
          name: windows-${{ matrix.arch }}
          path: dist/OpenRewind-windows-${{ matrix.arch }}.zip

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ startsWith(env.VERSION, 'v') && env.VERSION || format('v{0}', env.VERSION) }}
          name: OpenRewind ${{ startsWith(env.VERSION, 'v') && env.VERSION || format('v{0}', env.VERSION) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: assets/*
