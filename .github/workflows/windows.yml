name: Windows app

on:
  push:
    paths: ["windows/**", "Sources/openrewind/WebUI.swift", "scripts/build-windows.ps1", "THIRD_PARTY_NOTICES.txt", "scripts/launch-check-windows.ps1", "scripts/mcp-check-windows.ps1", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "Sources/openrewind/WebUI.swift", "scripts/build-windows.ps1", "THIRD_PARTY_NOTICES.txt", "scripts/launch-check-windows.ps1", "scripts/mcp-check-windows.ps1", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    # Unsigned: the Azure signing secrets live in the "release" environment, which only the
    # Release workflow uses, so branch and PR builds never see them.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Build, test and package
        shell: pwsh
        run: scripts/build-windows.ps1 -Arch ${{ matrix.arch }}
      # Start the tray app the way a double-click does and make sure it is still running 30 s later.
      - name: Launch check
        if: matrix.arch == 'x64'
        shell: pwsh
        run: scripts/launch-check-windows.ps1 -ExePath dist/win-x64/OpenRewind.exe
      # Write and read back a short test video the way Compress Older Recordings does (Media Foundation).
      - name: Video check
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $env:OPENREWIND_HOME = Join-Path $env:RUNNER_TEMP "openrewind-video-check"
          $out = Join-Path $env:RUNNER_TEMP "video-check.txt"
          $p = Start-Process dist/win-x64/OpenRewind.exe -ArgumentList "video-check" -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError "$out.err"
          Get-Content $out, "$out.err" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "video check failed (exit $($p.ExitCode))" }
      # Start it as an AI app does (OpenRewind.exe mcp, pipes for stdin/stdout) and talk MCP to it.
      - name: MCP check
        if: matrix.arch == 'x64'
        shell: pwsh
        run: scripts/mcp-check-windows.ps1 -ExePath dist/win-x64/OpenRewind.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenRewind-win-${{ matrix.arch }}
          path: dist/win-${{ matrix.arch }}/
