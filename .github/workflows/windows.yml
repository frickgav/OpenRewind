name: Windows app

on:
  push:
    paths: ["windows/**", "Sources/openrewind/WebUI.swift", "scripts/build-windows.ps1", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "Sources/openrewind/WebUI.swift", "scripts/build-windows.ps1", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    env:
      # Signing runs only when the Azure Trusted Signing secrets are set (see windows/README.md).
      CAN_SIGN: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build, test and package
        shell: pwsh
        run: scripts/build-windows.ps1 -Arch ${{ matrix.arch }}
      # Start the tray app the way a double-click does and make sure it is still running 30 s later.
      - name: Launch check
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $home_ = Join-Path $env:RUNNER_TEMP "openrewind-home"
          New-Item -ItemType Directory -Force $home_ | Out-Null
          $env:OPENREWIND_HOME = $home_
          $crash = Join-Path $env:LOCALAPPDATA "OpenRewind\crash.log"
          Remove-Item $crash -ErrorAction SilentlyContinue
          $p = Start-Process "dist\win-x64\OpenRewind.exe" -PassThru
          Start-Sleep -Seconds 30
          $alive = -not $p.HasExited
          Write-Host "--- openrewind.log"; Get-Content (Join-Path $home_ "openrewind.log") -ErrorAction SilentlyContinue
          Write-Host "--- crash.log"; Get-Content $crash -ErrorAction SilentlyContinue
          if ($alive) { Stop-Process -Id $p.Id -Force } else { Write-Host "exit code $($p.ExitCode)" }
          if (-not $alive -or (Test-Path $crash)) { throw "OpenRewind did not keep running after launch" }
      - name: Sign with Azure Trusted Signing
        if: env.CAN_SIGN == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: dist/win-${{ matrix.arch }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRewind-win-${{ matrix.arch }}
          path: dist/win-${{ matrix.arch }}/
